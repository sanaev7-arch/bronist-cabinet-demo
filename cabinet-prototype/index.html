<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Бронист — кабинет хоста (прототип)</title>
<link rel="icon" href="data:,">
<script src="tailwind.js"></script>
<script>tailwind.config = { theme: { extend: { colors: { bordo: '#8b1d41' } } } };</script>
<script src="lucide.min.js"></script>
<!-- DnD на тач для самого shell (drag-reorder пунктов меню); экранам полифил инжектится при загрузке iframe -->
<script type="module">
  import { enableDragDropTouch } from './drag-drop-touch.esm.min.js';
  enableDragDropTouch(document, document, { isPressHoldMode: true, pressHoldDelayMS: 350, forceListen: true });
</script>
<style>
  @font-face { font-family:'Inter'; src:url('InterVariable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  @font-face { font-family:'Geist Mono'; src:url('GeistMono-Variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  * { font-family:'Inter', system-ui, sans-serif; }
  /* .mono = табличные цифры на Inter. Geist Mono НЕ используем: его перечёркнутый ноль
     зашит как дефолтный глиф шрифта и не убирается никакими font-feature-settings (#6/#10/#12). */
  .mono { font-family:'Inter', system-ui, sans-serif; font-variant-numeric:tabular-nums; }
  html, body { height:100%; margin:0; }
  #screen { transition: opacity .18s ease; opacity: 0; }   /* плавное появление экрана (S7) */
  /* свёрнутый sidebar */
  aside#shell-sidebar.collapsed { width:64px !important; }
  aside#shell-sidebar.collapsed .lbl,
  aside#shell-sidebar.collapsed .brand-name,
  aside#shell-sidebar.collapsed .grip { display:none !important; }
  aside#shell-sidebar.collapsed .ic-collapse { display:none !important; }
  aside#shell-sidebar:not(.collapsed) .ic-expand { display:none !important; }
  /* свёрнутый: брэнд-блок без padding, лого-H скрыто, кнопка-разворот по центру (#11) */
  aside#shell-sidebar.collapsed .brand { padding-left:0; padding-right:0; justify-content:center; }
  aside#shell-sidebar.collapsed .brand-logo { display:none !important; }
  aside#shell-sidebar.collapsed .desktop-collapse { margin-left:0 !important; }
  /* drag */
  .nav-row.dragging { opacity:.4; }
  .nav-row.drag-over { box-shadow: inset 0 2px 0 0 #0f766e; }
  /* mobile drawer */
  #shell-backdrop { display:none; }
  .mobile-burger { display:none !important; }   /* по умолчанию скрыт (desktop) */
  @media (max-width: 767px) {
    aside#shell-sidebar { position:fixed; z-index:50; height:100%; transform:translateX(-100%); transition:transform .2s; }
    aside#shell-sidebar.drawer-open { transform:translateX(0); }
    #shell-backdrop.active { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
    .desktop-collapse { display:none !important; }  /* !important: иначе tailwind-утилита grid перебивает и кнопка collapse видна в drawer */
    .mobile-burger { display:grid !important; }  /* показываем только на мобиле */
    /* 16px — иначе iOS Safari зумит страницу при фокусе на поле поиска, и зум остаётся после перехода */
    #search-input { font-size:16px; }
  }
  /* iOS: 100vh выше видимой области (адресная строка) — низ экрана и тосты уходили за край.
     dvh = реальная видимая высота, пересчитывается при скрытии/появлении панелей Safari. */
  @supports (height: 100dvh) {
    main.h-screen, aside#shell-sidebar { height:100dvh !important; }
  }
</style>
</head>
<body class="flex bg-neutral-50 text-neutral-900">

  <!-- ОБЩИЙ SIDEBAR -->
  <aside id="shell-sidebar" class="w-60 shrink-0 border-r border-neutral-200 flex flex-col bg-white transition-[width] duration-200 h-screen">
    <div class="brand h-16 flex items-center gap-2.5 px-5 border-b border-neutral-200 shrink-0">
      <div class="brand-logo w-8 h-8 rounded-lg bg-teal-700 text-white grid place-items-center text-[13px] font-bold shrink-0">Б</div>
      <span class="brand-name font-bold tracking-tight text-[16px]">Бронист</span>
      <button onclick="toggleCollapse()" title="Свернуть/развернуть" class="desktop-collapse ml-auto w-8 h-8 grid place-items-center rounded-md text-neutral-500 hover:bg-neutral-100 hover:text-teal-700">
        <i data-lucide="panel-left-close" class="ic-collapse w-[18px] h-[18px]"></i>
        <i data-lucide="panel-left-open" class="ic-expand w-[18px] h-[18px]"></i>
      </button>
    </div>
    <nav id="shell-nav" class="flex-1 px-2.5 py-4 space-y-1 overflow-y-auto"></nav>
    <!-- Настройки — отдельным блоком, прижаты к низу -->
    <div id="nav-settings-slot" class="px-2.5 py-2 border-t border-neutral-200 shrink-0"></div>
    <div class="px-3 py-2.5 text-[11px] text-neutral-400 shrink-0">
      <span class="lbl">Прототип · пункты можно перетаскивать</span>
    </div>
  </aside>

  <div id="shell-backdrop" onclick="closeDrawer()"></div>

  <!-- ОБЛАСТЬ ЭКРАНА -->
  <main class="flex-1 min-w-0 h-screen flex flex-col">
    <!-- fixed (не absolute): бургер остаётся на месте при любом скролле/зуме контента -->
    <button onclick="openDrawer()" class="mobile-burger fixed top-3 left-3 z-30 w-9 h-9 bg-white border border-neutral-200 rounded-lg grid place-items-center text-neutral-700 shadow-sm"><i data-lucide="menu" class="w-5 h-5"></i></button>
    <iframe id="screen" class="w-full flex-1 border-0" title="Экран кабинета"></iframe>
  </main>

  <!-- ГЛОБАЛЬНЫЙ ПОИСК (⌘K) — палитра поверх любого экрана -->
  <div id="search-overlay" class="hidden fixed inset-0 bg-black/30 z-50" onclick="closeSearch()">
    <div class="mx-auto mt-[12vh] w-[600px] max-w-[calc(100vw-2rem)] bg-white rounded-xl shadow-2xl border border-neutral-200 overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center gap-2.5 px-4 border-b border-neutral-100">
        <i data-lucide="search" class="w-[18px] h-[18px] text-neutral-400 shrink-0"></i>
        <input id="search-input" autocomplete="off" class="flex-1 h-12 outline-none text-[14px] placeholder-neutral-400" placeholder="Гость, объект, бронь, раздел или действие…">
        <kbd class="text-[10.5px] font-semibold text-neutral-400 border border-neutral-200 rounded px-1.5 py-0.5">Esc</kbd>
      </div>
      <div id="search-results" class="max-h-[55vh] overflow-y-auto py-1.5"></div>
    </div>
  </div>

<script>
  // ── Единый NAV: 9 пунктов, Календарь (не Брони), Настройки последним ──
  const SCREENS = [
    { key:'home',       icon:'layout-dashboard', label:'Сводка',        src:'../cabinet-home-20260527/variant-B5.html' },
    { key:'chats',      icon:'message-square',   label:'Чаты', badge:'5', src:'../cabinet-chats-20260601/variant-chats.html' },
    { key:'automation', icon:'zap',              label:'Автоматизация', src:'../cabinet-automation-20260602/variant-automation.html' },
    { key:'calendar',   icon:'calendar',         label:'Календарь',     src:'../cabinet-bookings-20260602/variant-bookings.html' },
    { key:'objects',    icon:'building-2',       label:'Объекты',       src:'../cabinet-objects-20260601/variant-objects.html' },
    { key:'locks',      icon:'lock',             label:'Замки',         src:'../cabinet-locks-20260602/variant-locks.html' },
    { key:'analytics',  icon:'bar-chart-3',      label:'Аналитика',     src:'../cabinet-analytics-20260602/variant-analytics.html' },
    { key:'journal',    icon:'scroll-text',      label:'Журналы',       src:'../cabinet-journal-20260604/variant-journal.html' },
    { key:'settings',   icon:'settings',         label:'Настройки',     src:'../cabinet-settings-20260604/variant-settings.html' },
  ];

  // порядок из localStorage (drag-reorder запоминается)
  let order = JSON.parse(localStorage.getItem('h24_nav_order') || 'null');
  // перетаскиваемые пункты — все кроме Настроек (они фиксированы внизу)
  function orderedScreens() {
    const main = SCREENS.filter(s => s.key !== 'settings');
    if (!order) return main;
    const map = Object.fromEntries(main.map(s => [s.key, s]));
    const out = order.map(k => map[k]).filter(Boolean);
    main.forEach(s => { if (!out.includes(s)) out.push(s); }); // новые пункты в хвост
    return out;
  }

  let activeKey = (location.hash || '#home').slice(1);
  if (!SCREENS.some(s => s.key === activeKey)) activeKey = 'home';

  function renderNav() {
    const nav = document.getElementById('shell-nav');
    nav.innerHTML = orderedScreens().map(s => `
      <a data-key="${s.key}" draggable="true"
         onclick="setScreen('${s.key}')"
         class="nav-row flex items-center gap-2 px-2 py-2.5 rounded-lg cursor-pointer text-[15px] font-medium ${s.key===activeKey ? 'bg-teal-700 text-white' : 'text-neutral-700 hover:bg-neutral-100'}">
        <i data-lucide="grip-vertical" class="grip w-4 h-4 ${s.key===activeKey ? 'text-white/40' : 'text-neutral-300'}"></i>
        <i data-lucide="${s.icon}" class="w-5 h-5 shrink-0"></i>
        <span class="lbl">${s.label}</span>
        ${s.badge ? `<span class="lbl ml-auto mono text-[11px] font-semibold px-1.5 py-0.5 rounded-full ${s.key===activeKey ? 'bg-white text-teal-700' : 'bg-teal-700 text-white'}">${s.badge}</span>` : ''}
      </a>`).join('');
    // Настройки — отдельный фиксированный пункт внизу (без grip, не перетаскивается)
    const st = SCREENS.find(s => s.key === 'settings');
    document.getElementById('nav-settings-slot').innerHTML = `
      <a onclick="setScreen('settings')"
         class="flex items-center gap-2 px-2 py-2.5 rounded-lg cursor-pointer text-[15px] font-medium ${activeKey==='settings' ? 'bg-teal-700 text-white' : 'text-neutral-700 hover:bg-neutral-100'}">
        <i data-lucide="${st.icon}" class="w-5 h-5 shrink-0 ml-[22px]"></i>
        <span class="lbl">${st.label}</span>
      </a>`;
    lucide.createIcons();
    wireDrag();
  }

  // переход в Настройки → подраздел «Реферальная программа» (из панели топбара)
  let pendingSub = null;
  function openReferral() { pendingSub = 'referral'; setScreen('settings'); }

  function setScreen(key) {
    activeKey = key;
    location.hash = key;
    const s = SCREENS.find(x => x.key === key);
    const f = document.getElementById('screen');
    f.style.opacity = '0';            // плавное появление: гасим перед сменой (S7)
    // cache-buster: каждый экран грузим свежим, иначе браузер отдаёт старую версию iframe
    f.src = s.src + (s.src.includes('?') ? '&' : '?') + 'embed=1&_=' + Date.now();
    renderNav();
    closeDrawer();
  }

  // ФУНДАМЕНТ (глобально для всех экранов): прячем внутренний sidebar,
  // отключаем перечёркнутый ноль, плавно показываем экран
  document.getElementById('screen').addEventListener('load', function () {
    try {
      const doc = this.contentDocument;
      if (!doc) return;
      ['sidebar', 'drawerBackdrop'].forEach(id => {
        const el = doc.getElementById(id);
        if (el) el.style.display = 'none';
      });
      // slashed-zero off на весь документ экрана (S2)
      if (!doc.getElementById('h24-fundament')) {
        const st = doc.createElement('style');
        st.id = 'h24-fundament';
        // ROOT-FIX перечёркнутых нулей (#6/#10/#12): перечёркнутый ноль зашит в сам файл
        // GeistMono-Variable.woff2 как дефолтный глиф — font-feature-settings его НЕ убирает
        // (проверено: ss01/zero/cv не помогают). Поэтому .mono переводим на Inter с табличными
        // цифрами — чистый ноль, выровненные колонки, тот же шрифт, что и весь UI.
        st.textContent = ".mono{font-family:'Inter',system-ui,sans-serif!important;" +
                         "font-variant-numeric:tabular-nums!important;font-feature-settings:normal!important}" +
                         // курсоры под действие на всех экранах: кликабельное → pointer, перетаскиваемое → grab.
                         // grab-правило ИДЁТ ПОСЛЕ pointer → у draggable-элементов (даже с onclick) выигрывает grab.
                         "button:not([disabled]),select,summary,label,a,[onclick]{cursor:pointer}" +
                         "[draggable=\"true\"],.grip,.wdrag,.lock-card,.seg,.kb-card{cursor:grab}" +
                         "[draggable=\"true\"]:active,.grip:active,.wdrag:active,.lock-card:active,.seg:active,.kb-card:active{cursor:grabbing}" +
                         // MOBILE-фундамент для всех экранов:
                         // 1) инпуты ≥16px — iOS Safari зумит страницу при фокусе на меньших, зум остаётся после перехода («растянутый экран»);
                         // 2) топбар sticky — при скролле шапка с бургером оставалась доступной.
                         "@media (max-width:768px){" +
                         "input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}" +
                         "header.topbar{position:sticky;top:0;z-index:45;background:#fff}" +
                         "}";
        doc.head.appendChild(st);
      }
      // DnD на тач-устройствах: HTML5 drag&drop не работает на touch — полифил DragDropTouch
      // (press-hold: drag после удержания ~350мс, обычный свайп остаётся скроллом)
      if (!doc.getElementById('h24-ddt')) {
        const sc = doc.createElement('script');
        sc.id = 'h24-ddt'; sc.type = 'module';
        sc.textContent = "import {enableDragDropTouch} from '" + new URL('drag-drop-touch.esm.min.js', location.href).href + "';" +
                         "enableDragDropTouch(document, document, {isPressHoldMode:true, pressHoldDelayMS:350, forceListen:true});";
        doc.head.appendChild(sc);
      }
      injectTopbar(doc);              // единый профиль (#1) + колокольчик (#9) + toast (#4) на всех экранах
      // если переходили из панели «Все приглашения» — открыть нужный подраздел Настроек
      if (activeKey === 'settings' && pendingSub && this.contentWindow.setSub) {
        this.contentWindow.setSub(pendingSub); pendingSub = null;
      }
    } catch (e) { /* cross-origin — игнор */ }
    this.style.opacity = '1';         // показать после загрузки
  });

  // ── Единый правый модуль топбара: Free/Тариф + колокольчик-дропдаун + профиль-дропдаун ──
  // Структура топбаров всех 9 экранов одинакова (justify-between, первый ребёнок — левый блок).
  // Оставляем левый блок, остальное заменяем единым модулем — один источник вместо 9 копий.
  const NOTIF_ITEMS = [
    { icon:'sparkles',  t:'Единый дизайн кабинета',  s:'Профиль и уведомления теперь на всех экранах', time:'сегодня' },
    { icon:'megaphone', t:'Новость Бронист',          s:'WhatsApp снова работает в РФ без VPN — подключим каналом', time:'вчера' },
    { icon:'info',      t:'Совет',                    s:'Перетаскивайте пункты меню и виджеты под себя', time:'2 дня назад' },
  ];

  // ── Реферальная программа: воронка приглашений (приглашён → на демо → подключён → оплатил) ──
  // Бонус начисляется по первой оплате приглашённого; форма награды (слот/функция старшего
  // тарифа) финализируется после тарифной сетки — см. plans/2026-06-07-referral-program.md.
  const REF_ITEMS = [
    { name:'Анна П.',        status:'Оплатила',   chip:'bg-teal-50 text-teal-700',        bonus:'+1 слот · начислен', bicon:'check-circle-2', bcolor:'text-teal-600' },
    { name:'Сергей М.',      status:'Подключён',  chip:'bg-sky-50 text-sky-700',          bonus:'бонус ожидается',    bicon:'clock',          bcolor:'text-amber-500' },
    { name:'+7 905 •••• 44', status:'На демо',    chip:'bg-amber-50 text-amber-700',      bonus:'—',                  bicon:'minus',          bcolor:'text-neutral-300' },
    { name:'Ольга К.',       status:'Приглашена', chip:'bg-neutral-100 text-neutral-600', bonus:'—',                  bicon:'minus',          bcolor:'text-neutral-300' },
  ];

  function installToast(doc) {           // единая позиция toast — низ-центр (#4)
    const w = doc.defaultView;
    let host = doc.getElementById('h24-toast-host');
    if (!host) {
      host = doc.createElement('div'); host.id = 'h24-toast-host';
      // на мобиле выше (84px + safe-area): у нижнего края тост уходил за границу видимой области iOS
      const tb = (w.matchMedia && w.matchMedia('(max-width:768px)').matches)
        ? 'calc(84px + env(safe-area-inset-bottom, 0px))' : '24px';
      host.style.cssText = 'position:fixed;left:50%;bottom:' + tb + ';transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
      doc.body.appendChild(host);
    }
    w.toast = function (msg, type) {
      const m = typeof msg === 'string' ? msg : '';
      // авто-тип по тексту, если не задан явно (чтобы «Сохранено» давало галочку, а не info)
      if (!type) {
        if (/сохран|создан|добавлен|привязан|скопирован|обновл|включ|готово|удал[её]н|переподключ|запущен|отправлен/i.test(m)) type = 'success';
        else if (/ошибк|не удалось|сбой|провал/i.test(m)) type = 'error';
        else if (/внимани|осторожн|предупрежд|риск/i.test(m)) type = 'warn';
      }
      // иконка релевантна типу; success/info — зелёный бренда (как кнопки), warn — amber, error — red
      const ic = { success: ['#14b8a6', 'M8 12l3 3 5-5'], error: ['#f87171', 'M15 9l-6 6M9 9l6 6'], warn: ['#fbbf24', 'M12 8v5M12 16h.01'], info: ['#14b8a6', 'M12 16v-4M12 8h.01'] }[type] || ['#14b8a6', 'M12 16v-4M12 8h.01'];  // дефолт — info
      const t = doc.createElement('div');
      t.style.cssText = 'display:flex;align-items:center;gap:8px;background:#171717;color:#fff;font:500 13px Inter,sans-serif;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:.18s';
      t.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="' + ic[0] + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="' + ic[1] + '"/></svg><span>' + (typeof msg === 'string' ? msg : 'Готово') + '</span>';
      host.appendChild(t);
      requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
      setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 200); }, 2200);
    };
  }

  function injectTopbar(doc) {
    const bar = doc.querySelector('header.topbar');
    if (!bar || bar.dataset.h24topbar) return;
    bar.dataset.h24topbar = '1';
    [...bar.children].slice(1).forEach(k => k.remove());   // оставить левый блок, остальное заменить
    // заглушки для старых обработчиков экрана (document-click обращается к #supportMenu/#profileMenu,
    // которые мы удалили вместе с родным топбаром — без заглушки падает null.classList при каждом клике)
    ['supportMenu', 'profileMenu'].forEach(id => { if (!doc.getElementById(id)) { const s = doc.createElement('div'); s.id = id; s.className = 'hidden'; s.style.display = 'none'; doc.body.appendChild(s); } });
    const notif = NOTIF_ITEMS.map(n => `
      <div class="flex items-start gap-3 px-4 py-3 hover:bg-neutral-50 border-b border-neutral-100 last:border-0">
        <div class="w-8 h-8 rounded-lg bg-teal-50 grid place-items-center shrink-0"><i data-lucide="${n.icon}" class="w-[18px] h-[18px] text-teal-600"></i></div>
        <div class="min-w-0"><div class="text-[13px] font-semibold text-neutral-900">${n.t}</div>
          <div class="text-[12px] text-neutral-500 leading-snug">${n.s}</div>
          <div class="text-[11px] text-neutral-400 mt-0.5">${n.time}</div></div>
      </div>`).join('');
    const refRows = REF_ITEMS.map(r => `
      <div class="flex items-center gap-3 px-4 py-2.5 hover:bg-neutral-50 border-b border-neutral-100 last:border-0">
        <div class="w-8 h-8 rounded-full bg-neutral-100 grid place-items-center text-[12px] font-semibold text-neutral-500 shrink-0">${r.name.replace(/[^А-Яа-яA-Za-z]/g,'').slice(0,1) || '•'}</div>
        <div class="min-w-0 flex-1">
          <div class="text-[13px] font-medium text-neutral-900 truncate">${r.name}</div>
          <div class="flex items-center gap-1.5 mt-0.5"><i data-lucide="${r.bicon}" class="w-3.5 h-3.5 ${r.bcolor} shrink-0"></i><span class="text-[11.5px] text-neutral-500 truncate">${r.bonus}</span></div>
        </div>
        <span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${r.chip} shrink-0">${r.status}</span>
      </div>`).join('');
    bar.insertAdjacentHTML('beforeend', `
      <div class="flex items-center gap-2.5 desktop-only">
        <div class="relative">
          <button id="h24-ref-btn" class="flex items-center gap-1.5 h-10 px-3.5 rounded-lg bg-bordo text-white text-[13px] font-semibold hover:brightness-110 shadow-sm">
            <i data-lucide="gift" class="w-[18px] h-[18px]"></i> Бонусы

  // ── ГЛОБАЛЬНЫЙ ПОИСК (⌘K): разделы + демо-данные (объекты, гости/брони, действия) ──
  const SEARCH_ITEMS = [

  let searchHits = [];   // плоский список текущих результатов (для клавиатуры)

  function openSearch() {

  function renderSearch(q) {
    const box = document.getElementById('search-results');
    q = q.trim().toLowerCase();
    searchHits = SEARCH_ITEMS.filter(it => !q || (it.label + ' ' + it.sub).toLowerCase().includes(q));
    if (searchSel >= searchHits.length) searchSel = 0;
    if (!searchHits.length) {
      box.innerHTML = '<div class="px-4 py-6 text-center text-[13px] text-neutral-400">Ничего не нашлось. Попробуйте имя гостя, адрес или раздел.</div>';
      return;
    }
    let html = '', lastGroup = null;
    searchHits.forEach((it, i) => {
      if (it.group !== lastGroup) {
        html += `<div class="px-4 pt-2.5 pb-1 text-[11px] font-semibold text-neutral-400 uppercase tracking-wide">${it.group}</div>`;
        lastGroup = it.group;
      }
      html += `
        <div data-i="${i}" onclick="searchGo(${i})" onmousemove="searchSel=${i};markSel()"
             class="srch-row flex items-center gap-3 mx-1.5 px-2.5 py-2 rounded-lg cursor-pointer ${i === searchSel ? 'bg-teal-50' : 'hover:bg-neutral-50'}">

    if (e.key === 'ArrowDown') { e.preventDefault(); searchSel = Math.min(searchSel + 1, searchHits.length - 1); markSel(); }

        const from = keys.indexOf(dragEl.dataset.key);
        const to   = keys.indexOf(row.dataset.key);
        keys.splice(to, 0, keys.splice(from, 1)[0]);
        order = keys;
        localStorage.setItem('h24_nav_order', JSON.stringify(order));
        renderNav();
      });
    });
  }

  function toggleCollapse() { document.getElementById('shell-sidebar').classList.toggle('collapsed'); }
  function openDrawer()  { document.getElementById('shell-sidebar').classList.add('drawer-open'); document.getElementById('shell-backdrop').classList.add('active'); }
  function closeDrawer() { document.getElementById('shell-sidebar').classList.remove('drawer-open'); document.getElementById('shell-backdrop').classList.remove('active'); }

  window.addEventListener('hashchange', () => {
    const k = location.hash.slice(1);
    if (k && k !== activeKey && SCREENS.some(s => s.key === k)) setScreen(k);
  });

  renderNav();
  setScreen(activeKey);
</script>
</body>
</html>
